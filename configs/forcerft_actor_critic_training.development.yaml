configuration_kind: forcerft_actor_critic_training.development
authorization: approved_offline_and_asynchronous_training

task:
  task_id: task2
  output_root: outputs/task2

parents:
  actor_checkpoint: outputs/task2/sft/checkpoints/forcesmolvla_sft_step_010000
  critic_checkpoint: outputs/task2/offline/checkpoints/offline_twin_q_critic_warmup_step_000256
  offline_exact_resume_checkpoint: outputs/task2/offline/checkpoints/offline_actor_critic_cycle_000210
  strict_load: true
  random_critic_fallback: false
  target_copy_fallback: false

environment:
  physical_cuda_device_index: 0
  visible_cuda_device_index: 0
  seed: 4404
  deterministic_algorithms: true
  cudnn_benchmark: false
  cudnn_deterministic: true

data:
  transition_root: artifacts/development/stage2/g1_frozen_detector_transition_view.v1
  lerobot_v3_root: datasets/task2_lerobotv3
  critic_backbone_npz: artifacts/development/stage2/reward_classifier/pretrained/resnet10_params.safe.npz
  critic_backbone_manifest: artifacts/development/stage2/reward_classifier/pretrained/resnet10_asset_manifest.v4.json
  online_replay_root: outputs/task2/online/replay
  offline_D_source: materialized_reward_terminal_demo_replay
  current_episode_sampling: false

batching:
  critic_batch_size: 64
  critic_R_count: 32
  critic_D_count: 32
  actor_batch_size: 24
  actor_R_count: 12
  actor_D_count: 12
  flow_inference_subbatch: 4
  flow_horizon: 50
  flow_steps: 10
  critic_slots: 3
  action_features: 7

offline_training:
  joint_cycles: 210
  critic_updates_per_cycle: 2
  actor_updates_per_cycle: 1
  target_polyak_updates_per_cycle: 2
  demo_only: true
  vlm_frozen: true
  expert_only_flow_matching: true

online_training:
  training_starts: 100
  demo_ratio: 0.5
  online_ratio: 0.5
  critic_updates_per_cycle: 2
  actor_updates_per_cycle: 1
  target_polyak_updates_per_cycle: 2
  actor_parameter_broadcast_period: 5
  checkpoint_period: 50
  save_checkpoint_on_graceful_exit: true
  keep_latest_checkpoints: 2
  server_persistent: true
  current_episode_sampling: false

optimizer:
  actor:
    type: AdamW
    lr: 1.0e-5
    grad_clip_norm: 10.0
  critic:
    type: Adam
    lr: 3.0e-4
    grad_clip_norm: 10.0
  polyak_tau: 0.005

loss:
  beta_expert_flow_matching: 1.0
  eta_actor_q: 0.1
  lambda_policy_behavior_anchor: 0.1
  balance_weight: 0.01
  z_weight: 0.001
  online_critic: pure_td
  min_twin_q_actor_guidance: true
  tcp6_q_gradient: true
  gripper_q_stop_gradient: true
  calql_enabled: false
  cql_enabled: false
  random_candidates_enabled: false
  mc_return_input_enabled: false
