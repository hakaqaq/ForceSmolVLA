schema_version: forcesmolvla_stage3_policy_revision_loopback.v1.development
scope: G6P_isolated_immutable_policy_revision_lifecycle_loopback

synthetic_payloads:
  stable: ForceSmolVLA-G6P-tiny-stable-policy-v1\nweights=0,1,2,3\n
  candidate: ForceSmolVLA-G6P-tiny-candidate-policy-v1\nweights=4,5,6,7\n
  pending_after_rollback: ForceSmolVLA-G6P-tiny-pending-policy-v1\nweights=8,9,10,11\n
  final_pending: ForceSmolVLA-G6P-tiny-final-pending-policy-v1\nweights=20,21,22,23\n
  invalid: ForceSmolVLA-G6P-tiny-invalid-policy-v1\nweights=12,13,14,15\n
  orphan: ForceSmolVLA-G6P-tiny-orphan-policy-v1\nweights=16,17,18,19\n

learner_checkpoint:
  identity: synthetic-g6p-tiny-learner-checkpoint-v1
  state:
    learner_cycles: 7
    actor_tensor: [0.125, -0.25, 0.5]
    publication_count: 0

approved_hybrid_parent: configs/stage3_parent_binding.v1.development.json

contract_files:
  action_contract:
    - configs/stage2_action_contract.v2.development.json
  normalizer:
    - artifacts/development/stage2/stage2b_cycle210_evaluation_smoke_checkpoint.v1/manifests/normalizer_manifest.json
  calibration:
    - configs/calibration_bundle.development.json
  wrench_contract:
    - configs/wrench_filter_resample_spec.development.json
    - configs/wrench_geometry_spec.development.json
  reward_rulespec:
    - configs/stage2_reward_spec.development.yaml
    - configs/stage3_reward_terminal_contract.v1.development.json
    - schemas/rulespec.schema.json
  task_feature:
    - artifacts/development/stage2/s2_g2_twin_q_topology.json
  trainability:
    - configs/stage2_trainability_contract.v2.development.json
    - configs/stage3_trainability_contract.v1.development.json

source_binding:
  recursive_globs:
    - src/forcesmolvla/**/*.py
    - configs/stage3_*
    - vendor/lerobot/src/lerobot/policies/smolvla/**/*.py
  exact_files:
    - tools/run_stage3_policy_revision_loopback.py
    - tools/serve_policy.py
    - configs/deployment.active.development.json
    - schemas/stage3_policy_revision.v1.schema.json
    - schemas/stage3_policy_revision_loopback_report.v1.schema.json
    - environment-manifest/requirements.lock
  vendor_path: vendor/lerobot
  production_requirements:
    stage3_policy_server: tools/serve_policy_stage3.py
    production_revision_exporter: tools/export_policy_revision_stage3.py
    production_revision_publisher: tools/publish_policy_revision_stage3.py
    robot_reset_home_witness: robot/deployment/reset_home_witness.py
    durable_production_wal: src/forcesmolvla/rft/stage3/wal.py
    durable_production_outbox: src/forcesmolvla/rft/stage3/outbox.py

runtime_environment:
  lock: environment-manifest/requirements.lock
  cuda_visible_devices: ""

temporal_action_dimensions:
  policy_hz: 10
  controller_hz: 30
  flow_horizon: 50
  critic_slots: 3
  state_features: 7
  wrench_features: 6
  action_features: 7
  camera_count: 2

lifecycle_contract:
  pending_on_rollback: retain_pending_no_auto_activation
  fresh_process_reset_state: unknown_fail_closed_safe_reset_required
  witnesses: synthetic_boolean_gate_evidence_only
  production_activation: false
