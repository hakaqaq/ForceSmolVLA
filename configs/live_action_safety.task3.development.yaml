rules:
  - rule_id: SS_WORKSPACE
    description: Task3 TCP targets remain inside the recorded ForceVLA/HIL-SERL tabletop workspace.
    scope: candidate
    inputs: [absolute_action7]
    input_artifacts: []
    frame: fr3_link0
    unit: m
    clock_domain: upper_host_monotonic_ns
    formula: all(min_xyz_m <= xyz <= max_xyz_m)
    formula_revision: task3-live-action-v1
    window: full candidate chunk
    sampling: every candidate action
    aggregation: all_true
    threshold: {value: true, comparator: all_true, provenance: exact task3 session workspace recorded by the proven ForceVLA HIL-SERL collection path and approved by rlc123 on 2026-09-02, approval_status: approved}
    parameters: {min_xyz_m: [0.196, -0.293, 0.008], max_xyz_m: [0.796, 0.257, 0.415]}
    failure_code: SHADOW_WORKSPACE_INVALID
    severity: reject_candidate
    remediation: Reject the full action chunk without dispatch.
    golden_fixture: {artifact: datasets/task3_lerobotv3/conversion_manifest.json, sha256: null}
  - rule_id: SS_ORIENTATION
    description: Absolute ZYX orientation remains canonical and outside the frozen two-degree singular region.
    scope: candidate
    inputs: [absolute_action7]
    input_artifacts: []
    frame: fr3_link0
    unit: rad
    clock_domain: upper_host_monotonic_ns
    formula: principal ZYX chart and abs(abs(pitch)-pi/2)>=gimbal_margin_rad
    formula_revision: task3-live-action-v1
    window: full candidate chunk
    sampling: every candidate action
    aggregation: all_true
    threshold: {value: true, comparator: all_true, provenance: frozen v4.2 action inverse safety contract approved by rlc123 on 2026-09-02, approval_status: approved}
    parameters: {min_rpy_rad: [-3.141592653589793, -3.141592653589793, -3.141592653589793], max_rpy_rad: [3.141592653589793, 3.141592653589793, 3.141592653589793], gimbal_margin_rad: 0.03490658503988659}
