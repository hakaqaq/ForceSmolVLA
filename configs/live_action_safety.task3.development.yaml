    golden_fixture: {artifact: tests/test_action_delta_and_masks.py, sha256: null}
  - rule_id: SS_DELTA_XYZ
    description: Adjacent absolute TCP translations remain within the ForceVLA deployment target-distance guard.
    scope: candidate
    inputs: [absolute_action7]
    input_artifacts: []
    frame: fr3_link0
    unit: m
    clock_domain: upper_host_monotonic_ns
    formula: max(norm(xyz[k]-xyz[k-1]))
    formula_revision: task3-live-action-v1
    window: full candidate chunk
    sampling: adjacent valid actions
    aggregation: maximum
    threshold: {value: 0.08, comparator: le, provenance: exact deploy_forcevla.py max-target-distance default approved by rlc123 on 2026-09-02, approval_status: approved}
    failure_code: SHADOW_DELTA_XYZ_EXCEEDED
    severity: reject_candidate
    remediation: Reject the full action chunk without dispatch.
    golden_fixture: {artifact: scripts/deploy_forcevla.py, sha256: null}
  - rule_id: SS_DELTA_ROT_GEODESIC
    description: Adjacent absolute TCP rotations remain within the ForceVLA deployment geodesic guard.
    scope: candidate
    inputs: [absolute_action7]
    input_artifacts: []
    frame: fr3_link0
    unit: rad
    clock_domain: upper_host_monotonic_ns
    formula: max(so3_geodesic(R[k-1],R[k]))
    formula_revision: task3-live-action-v1
    window: full candidate chunk
    sampling: adjacent valid actions
    aggregation: maximum
    threshold: {value: 0.4363323129985824, comparator: le, provenance: exact deploy_forcevla.py 25-degree max-target-rotation default approved by rlc123 on 2026-09-02, approval_status: approved}
