    severity: reject_candidate
    remediation: Reject the full action chunk without clipping.
    golden_fixture: {artifact: datasets/task3_lerobotv3/normalizer_manifest.json, sha256: null}
  - rule_id: SS_CONTINUITY
    description: The first chunk target remains continuous with the same t_ref raw state snapshot.
    scope: candidate
    inputs: [candidate_chunk, raw_state_snapshot]
    input_artifacts: []
    frame: fr3_link0
    unit: mixed
    clock_domain: upper_host_monotonic_ns
    formula: xyz norm, SO3 geodesic, and gripper-width difference from raw_state_snapshot
    formula_revision: task3-live-action-v1
    window: first valid action
    sampling: each candidate chunk
    aggregation: all_true
    threshold: {value: true, comparator: all_true, provenance: exact ForceVLA deployment target guards and task3 binary width semantics approved by rlc123 on 2026-09-02, approval_status: approved}
    parameters: {max_xyz_m: 0.08, max_rotation_rad: 0.4363323129985824, max_gripper_delta: 0.1}
