    golden_fixture: {artifact: scripts/deploy_forcevla.py, sha256: null}
  - rule_id: SS_GRIPPER_RANGE_RATE
    description: Task3 binary gripper targets retain absolute physical width semantics.
    scope: candidate
    inputs: [absolute_action7]
    input_artifacts: []
    frame: null
    unit: m_and_m_per_s
    clock_domain: upper_host_monotonic_ns
    formula: range and abs(width[k]-width[k-1])*30
    formula_revision: task3-live-action-v1
    window: full candidate chunk
    sampling: every valid action
    aggregation: all_true
    threshold: {value: true, comparator: all_true, provenance: task3 train population uses canonical binary gripper endpoints; approved by rlc123 on 2026-09-02, approval_status: approved}
    parameters: {min_value: 0.0, max_value: 0.1, max_rate_per_s: 2.5500000000000003}
