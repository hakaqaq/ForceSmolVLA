environment:
  random_seed: 4404

batching:
  twin_q_batch_size: 128
  residual_policy_value_batch_size: 64
  human_residual_imitation_batch_size: 32
  command_macro_slots: 3

ack_critic_warmup:
  minimum_ack_transitions: 1000
  minimum_admitted_episodes: 3
  optimizer_steps: 256

residual_actor_critic_training:
  scheduling_mode: continuous_async
  new_td_rows_per_cycle: 8
  twin_q_updates_per_cycle: 2
  residual_actor_updates_per_cycle: 1
  residual_candidate_interval_cycles: 100
  training_checkpoint_interval_cycles: 1000
  retained_training_checkpoint_count: 10
  checkpoint_on_warmup_complete: true
  checkpoint_on_candidate_activation: false

optimizer:
  residual_actor:
    type: Adam
    lr: 3.0e-5
    grad_clip_norm: 1.0

  twin_q:
    type: Adam
    lr: 3.0e-4
    grad_clip_norm: 10.0

  twin_q_polyak_tau: 0.005

objective:
  # Discount per real dispatch-to-successor decision transition. K=3 remains
  # the accepted-command ZOH encoding, not a fixed 100 ms transition clock.
  command_macro_discount: 0.99
  value_objective_weight: 0.1
  residual_magnitude_penalty_weight: 0.1
  human_residual_imitation_weight: 1.0

wrist_wrench_residual_actor:
  hidden_dim: 256
  max_normalized_residual: 0.1
  max_translation_residual_per_axis_m: 0.001
  max_rpy_residual_per_axis_rad: 0.008726646259971648

ack_residual_twin_q:
  hidden_dim: 256
  input_dim: 60
  condition_order:
    - control_source
    - gripper_command
  candidate_acceptance_mapping: differentiable_hilserl_adapter_filter_leash
