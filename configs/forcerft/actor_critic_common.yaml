environment:
  seed: 4404

batching:
  critic_batch_size: 128
  actor_policy_batch_size: 64
  actor_human_batch_size: 64
  critic_slots: 3

warmup:
  training_starts: 100
  critic_burnin_updates: 256

online_training:
  critic_updates_per_cycle: 2
  actor_updates_per_cycle: 1
  max_joint_cycles_per_admitted_episode: 10
  actor_candidate_period: 10
  checkpoint_period: 50
  keep_latest_checkpoints: 2

optimizer:
  actor:
    type: Adam
    lr: 1.0e-4
    grad_clip_norm: 1.0

  critic:
    type: Adam
    lr: 3.0e-4
    grad_clip_norm: 10.0

  polyak_tau: 0.005

loss:
  gamma_macro: 0.99
  actor_q_weight: 1.0
  residual_l2_weight: 0.01
  human_residual_weight: 1.0

residual_actor:
  hidden_dim: 256
  max_normalized_residual: 0.5

critic:
  hidden_dim: 256
