[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "forcesmolvla"
version = "0.1.0"
description = "ForceSmolVLA v4.1 available-sensor offline fine-tuning"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "pyyaml>=6,<7",
  "scipy==1.16.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/forcesmolvla"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
